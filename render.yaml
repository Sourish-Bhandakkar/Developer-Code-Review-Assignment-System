services:
  # 1. Backend Web Service
  - type: web
    name: dev-review-assignment-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true # Generates a secure random JWT secret automatically
      - key: FRONTEND_URL
        value: https://dev-review-assignment-frontend.onrender.com # Placeholder: Update to your actual frontend url after creation
      - key: DATABASE_URL
        fromDatabase:
          name: dev-review-assignment-db
          property: connectionString

  # 2. Frontend Static Site
  - type: web
    name: dev-review-assignment-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishDir: dist
    envVars:
      - key: VITE_API_URL
        value: https://dev-review-assignment-backend.onrender.com/api # Placeholder: Update to your actual backend url after creation
    routes:
      # React Router SPA Rewrite Rule
      - type: rewrite
        source: /*
        destination: /index.html

# 3. Production PostgreSQL Database
databases:
  - name: dev-review-assignment-db
    plan: free
